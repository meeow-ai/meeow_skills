<!doctype html>
<meta charset="utf-8">
<!-- story-stills film: one timeline. window.render(t) draws frame t (seconds); window.DUR = length. Edit SHOTS/CAPS + the layers. -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/* film-specific styles here */
</style>
<body>
<div class="layer" id="L1"><img src="gen/s1.png"></div>
<div class="layer" id="L2"><img src="gen/s2.png"><div id="stamp" class="stamp sans">DONE</div></div>
<div class="vig"></div>
<div id="spark"></div>
<div id="flash"></div>
<div class="cap sans" id="c1" style="top:170px;font-size:66px">Hook line, readable in 2 seconds.</div>
<div class="cap serif" id="c2" style="top:160px;font-size:84px;font-style:italic">Payoff line.</div>
<script src="kit.js"></script>
<script>
const { $, clamp, ease, pulse } = K;
window.DUR = 8.0;
// shots: [layer, start, end, zoomFrom, zoomTo, panX, panY, originY]: overlap neighbours by the 0.4 s crossfade
const SHOTS = [
  ['L1', 0.0, 4.2, 1.00, 1.10, 0, -20, '55%'],
  ['L2', 3.8, 8.0, 1.12, 1.02, 0, 30, '35%'],
];
const CAPS = [['c1', 0.3, 3.7], ['c2', 4.6, 8.0]];   // [id, in, out]
const sparks = K.sparkles(60);
window.render = (t) => {
  K.shots(t, SHOTS);
  K.caps(t, CAPS);
  sparks(t, clamp((t - 3.6) / 0.5) * clamp((5.0 - t) / 0.6));  // sparkle window
  K.stamp('stamp', t, 6.0);
  $('flash').style.opacity = pulse(t, 4.0, 0.35) * 0.9;      // flash on the cut
};
render(0);
</script>
</body>
